<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FilmBox</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .search {
      width: 45%;
      padding: 11px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    .hero {
      padding: 55px 20px;
      background: linear-gradient(135deg, #191919, #050505);
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #aaa;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }

    .section {
      padding: 25px 18px;
    }

    .section h2 {
      margin-bottom: 18px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .movie {
      background: #171717;
      border-radius: 10px;
      overflow: hidden;
    }

    .movie img {
      width: 100%;
      height: 240px;
      object-fit: cover;
    }

    .movie-info {
      padding: 12px;
    }

    .movie-info h3 {
      margin-bottom: 7px;
    }

    .movie-info p {
      color: #888;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .watch {
      display: block;
      text-align: center;
      background: #333;
      padding: 9px;
      border-radius: 6px;
      color: white;
      text-decoration: none;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (min-width: 700px) {
      .movies {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 500px) {
      .search {
        width: 40%;
      }

      .hero h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎬 FilmBox</div>

    <input
      class="search"
      type="text"
      placeholder="Search movies..."
    >
  </header>

  <section class="hero">
    <h1>Welcome to FilmBox</h1>

    <p>
      Discover movies, trailers and legally available downloads.
    </p>

    <a href="#movies" class="btn">
      Explore Movies
    </a>
  </section>

  <section class="section" id="movies">

    <h2>Latest Movies</h2>

    <div class="movies">

      <div class="movie">

        <img
          src="https://via.placeholder.com/400x600"
          alt="Movie Poster"
        >

        <div class="movie-info">

          <h3>Movie Name</h3>

          <p>2025 • Action</p>

          <a
            href="https://example.com"
            class="watch"
          >
            Watch / Download
          </a>

        </div>

      </div>


      <div class="movie">

        <img
          src="https://via.placeholder.com/400x600"
          alt="Movie Poster"
        >

        <div class="movie-info">

          <h3>Another Movie</h3>

          <p>2024 • Drama</p>

          <a
            href="https://example.com"
            class="watch"
          >
            Watch / Download
          </a>

        </div>

      </div>


      <div class="movie">

        <img
          src="https://via.placeholder.com/400x600"
          alt="Movie Poster"
        >

        <div class="movie-info">

          <h3>My Movie</h3>

          <p>2023 • Comedy</p>

          <a
            href="https://example.com"
            class="watch"
          >
            Watch / Download
          </a>

        </div>

      </div>

    </div>

  </section>

  <footer>
    © 2026 FilmBox
    <br>
    Legal content only.
  </footer>

</body>
</html>
